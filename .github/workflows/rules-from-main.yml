name: rules-from-main
# Main's copy of the rules judges every pull request: the done rules, each rule change explained and recorded,
# and no second check named rules-from-main (scripts/done-gate/pr.ts). `pull_request_target` always runs the
# workflow file from main, never the branch's copy, so a branch can't loosen the rules that judge it. That trigger
# also hands the job a token with write access to the base repository unless told otherwise, so this job reads the
# pull request only as data: it checks out main alone, fetches the pull request's commits without checking them
# out, installing, building or running them, holds read-only permissions, no secrets and no environment, keeps
# no git credentials, and passes the body through an environment variable, never pasted into a script.
# The pull request that adds this file can't be judged by it (main doesn't have it yet): Devesh merges that one
# himself, then makes `rules-from-main` a required check. If main's copy wrongly refuses every pull request,
# docs/runbooks/rules-check-way-back.md says what he does.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: rules-from-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules-from-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions SHA-pinned (AGENTS.md → Conventions), as in ci.yml.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11" # pinned to the Bun engine (AGENTS.md → Conventions)

      - name: Fetch the pull request's commits as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/pr/head"

      - name: Main's copy of the rules judges the pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/done-gate.ts pr --base origin/main --head refs/pr/head
