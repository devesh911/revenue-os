name: deploy
# The cloud test database's migrations are not applied here: .github/workflows/staging-migrations.yml applies them
# once `checks` has passed on the commit.
on:
  push:
    branches: [main] # -> staging
  release:
    types: [published] # tag -> prod

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # deploys must not preempt each other mid-flight

jobs:
  staging-app:
    # Slice 2's tested-image item (ROADMAP.md) arms this: image build, ship, compose up, checks against the server.
    # Until then the job SKIPS — a 7s echo reporting "deploy success" on every
    # main push made history indistinguishable from real deploys.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build + ship to VPS (staging stack)
        run: echo "Not built yet (Slice 2) - docker build, save, scp, compose up staging, then Playwright smoke"

  prod:
    # Slice 6's live-deploy item (ROADMAP.md) arms this (restore: github.event_name == 'release')
    if: false
    runs-on: ubuntu-latest
    environment: production # secrets live here only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Migrations first, then image swap, then health gate
        run: echo "Not built yet (Slice 6) - supabase db push (prod), compose pull+up, curl /health + /ready"
